name: Build and Release Electron App

on:
  push:
    branches:
      - main
  workflow_dispatch: # bisa dijalankan manual dari tab Actions

permissions:
  contents: write # wajib: electron-builder butuh izin membuat Release

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Baca versi dari package.json
        id: ver
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Versi terbaca: $VERSION"

      - name: Cek apakah release untuk versi ini sudah ada
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.ver.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            {
              echo "## Build DILEWATI"
              echo ""
              echo "Release **${{ steps.ver.outputs.tag }}** sudah ada di GitHub, jadi tidak ada installer baru yang diterbitkan."
              echo ""
              echo "Aplikasi yang sudah terpasang akan tetap melaporkan *\"tidak ada pembaruan\"* sampai versi dinaikkan."
              echo ""
              echo "**Cara memperbaiki:** naikkan \`version\` di \`package.json\` (dan samakan di \`package-lock.json\`), lalu push lagi."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Build dilewati::Release ${{ steps.ver.outputs.tag }} sudah ada. Naikkan version di package.json agar installer baru terbit."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Release ${{ steps.ver.outputs.tag }} belum ada -> lanjut build."
          fi

      - name: Install Node.js
        if: steps.check.outputs.exists == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Field "version" di package-lock.json tidak memengaruhi npm ci, jadi
      # ketidaksinkronan di sini tidak boleh memblokir rilis. Cukup rapikan di
      # runner (tidak di-commit) dan beri peringatan.
      - name: Samakan versi package-lock.json
        if: steps.check.outputs.exists == 'false'
        shell: bash
        run: |
          PKG=$(node -p "require('./package.json').version")
          LOCK=$(node -p "require('./package-lock.json').version")
          if [ "$PKG" != "$LOCK" ]; then
            echo "::warning title=Versi lock tidak sinkron::package.json=$PKG tetapi package-lock.json=$LOCK. Diperbaiki otomatis untuk build ini; jalankan 'npm run version:sync' lalu commit agar repo ikut rapi."
            node scripts/sync-lock-version.mjs
          else
            echo "Versi sinkron: $PKG"
          fi

      - name: Install Dependencies
        if: steps.check.outputs.exists == 'false'
        run: npm ci

      - name: Siapkan .env bawaan (opsional, dari secret APP_ENV)
        if: steps.check.outputs.exists == 'false'
        shell: bash
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
        run: |
          if [ -z "$APP_ENV" ]; then
            echo "Secret APP_ENV kosong -> installer dibuat tanpa .env bawaan."
          else
            printf '%s\n' "$APP_ENV" > .env
            echo ".env bawaan dibuat."
          fi

      - name: Build Next.js
        if: steps.check.outputs.exists == 'false'
        run: npm run build

      - name: Build & Publish Installer ke GitHub Releases
        if: steps.check.outputs.exists == 'false'
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
